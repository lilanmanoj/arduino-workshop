; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
; Note:
; Export environment variables before building the project
; Ex for Linux/Mac:
; export WIFI_SSID="your_wifi_ssid"
; export WIFI_PASS="your_wifi_password"
; export API_KEY="Firebase API key"
; export DB_URL="Firebase Realtime Database URL"
; export AUTH_EMAIL="Authentication user email"
; export AUTH_PASS="Authentication user password"
; To build for Arduino Uno:
; pio run -e uno
; To build and upload for ESP32-S3 DevKitC-1:
; pio run -e esp32-s3-devkitc-1 -t upload

[platformio]
name = Question1
description = "Real Sensor Performance Under Load"
default_envs = esp32-s3-devkitc-1

[common]
build_flags = 
	-D WIFI_SSID=\"${sysenv.WIFI_SSID}\"
	-D WIFI_PASS=\"${sysenv.WIFI_PASS}\"
	-D API_KEY=\"${sysenv.API_KEY}\"
	-D DB_URL=\"${sysenv.DB_URL}\"
	-D AUTH_EMAIL=\"${sysenv.AUTH_EMAIL}\"
	-D AUTH_PASS=\"${sysenv.AUTH_PASS}\"

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
build_flags = ${common.build_flags}
lib_deps = 
	adafruit/DHT sensor library@^1.4.6
	mobizt/Firebase ESP32 Client@^4.4.17
